name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Download and pre-filter Open Food Facts (Spain only)
        run: |
          curl -sfL "https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz" \
            | zcat \
            | awk -F'\t' '
                NR==1 {
                  for (i=1;i<=NF;i++) if ($i=="countries_tags") col=i
                  print
                  next
                }
                col && $col ~ /en:spain/ { print }
              ' > /tmp/off_spain.tsv

          COUNT=$(wc -l < /tmp/off_spain.tsv)
          echo "Filtered rows: $COUNT"
          if [ "$COUNT" -lt 1000 ]; then
            echo "ERROR: solo se filtraron $COUNT líneas — algo falló en el filtrado por país" >&2
            exit 1
          fi

      - name: Build Spain nutrition corpus from Open Food Facts
        run: node tools/nutrition-data/src/build-off-spain.mjs
        env:
          OFF_TSV_PATH: /tmp/off_spain.tsv

      - name: Prebuild native iOS project
        run: |
          cd apps/mobile
          npm install
          npm run prebuild

      - name: Build Archive without Signing
        run: |
          cd apps/mobile/ios
          xcodebuild -workspace NutAI.xcworkspace \
                     -scheme NutAI \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     ACTION=build

      - name: Create IPA Package
        run: |
          cd apps/mobile/ios/build/Build/Products/Release-iphoneos
          mkdir Payload
          mv NutAI.app Payload/
          zip -r NutAI.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutAI-iOS-App
          path: apps/mobile/ios/build/Build/Products/Release-iphoneos/NutAI.ipa
