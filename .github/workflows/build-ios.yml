name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.19

      - name: Download USDA nutrition datasets
        run: |
          mkdir -p /tmp/fdc
          cd /tmp/fdc
          curl -L -o foundation.zip "https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_foundation_food_csv_2025-04-24.zip"
          curl -L -o sr_legacy.zip "https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_sr_legacy_food_csv_2018-04.zip"
          unzip -o foundation.zip -d .
          unzip -o sr_legacy.zip -d .
          ls -la /tmp/fdc

      - name: Install dependencies and build data
        run: |
          npm install
          npm run data:build

      - name: Prebuild native iOS project
        run: |
          cd apps/mobile
          npm install
          npm run prebuild

      - name: Build Archive without Signing
        run: |
          cd apps/mobile/ios
          xcodebuild -workspace NutAI.xcworkspace \
                     -scheme NutAI \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     ACTION=build

      - name: Create IPA Package
        run: |
          cd apps/mobile/ios/build/Build/Products/Release-iphoneos
          mkdir Payload
          mv NutAI.app Payload/
          zip -r NutAI.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutAI-iOS-App
          path: apps/mobile/ios/build/Build/Products/Release-iphoneos/NutAI.ipa
