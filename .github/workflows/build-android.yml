name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Setup Java / JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download USDA nutrition datasets
        run: |
          mkdir -p /tmp/fdc
          cd /tmp/fdc
          curl -L -o foundation.zip "https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_foundation_food_csv_2025-04-24.zip"
          curl -L -o sr_legacy.zip "https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_sr_legacy_food_csv_2018-04.zip"
          unzip -o foundation.zip -d .
          unzip -o sr_legacy.zip -d .
          ls -la /tmp/fdc

      - name: Install dependencies and build data
        run: |
          npm install
          npm run data:build

      - name: Prebuild native Android project
        run: |
          cd apps/mobile
          npm install
          npm run prebuild

      - name: Build Android APK
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutAI-Android-APK
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
